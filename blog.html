<!DOCTYPE html>

<script>
  document.addEventListener('DOMContentLoaded', function() {
    const hamburgerBtn = document.getElementById('hamburger-btn');
    const sidebar = document.getElementById('sidebar');
    
    hamburgerBtn.addEventListener('click', function() {
      hamburgerBtn.classList.toggle('active');
      sidebar.classList.toggle('active');
    });

    // Close sidebar when clicking on a link
    const sidebarLinks = sidebar.querySelectorAll('a');
    sidebarLinks.forEach(link => {
      link.addEventListener('click', function() {
        hamburgerBtn.classList.remove('active');
        sidebar.classList.remove('active');
      });
    });
  });
</script>

    <!-- MAIN -->

      <!-- BLOG POSTS (DYNAMICALLY LOADED) -->

</div>

<script>
  // hello stalker, if youve been reading this far, the password is Keno28
  
  const correctPassword = 'Keno28';
  const authenticatedBlogs = new Set();

  async function loadBlogPosts() {
    const container = document.getElementById('posts-container');
    try {
      const response = await fetch('assets/blogs.json');
      if (!response.ok) {
        throw new Error('Failed to fetch blog list');
      }
      const posts = await response.json();
      
      if (posts.length === 0) {
        container.innerHTML = '<div style="font-family:Tahoma, sans-serif; font-size:11px; padding:10px; color:#555;">No blog posts found.</div>';
        return;
      }

      container.innerHTML = '';
      
      posts.forEach(post => {
        const details = document.createElement('details');
        details.style.marginBottom = '20px';
        if (post.private) {
          details.classList.add('sad-blog');
        }
        
        const summary = document.createElement('summary');
        summary.style.cursor = 'pointer';
        
        const titleDiv = document.createElement('div');
        titleDiv.className = 'sec-head';
        titleDiv.style.display = 'inline';
        titleDiv.textContent = post.title;
        
        const dateSpan = document.createElement('span');
        dateSpan.style.cssText = 'font-size:11px; color:#888; white-space:nowrap; margin-left:8px;';
        dateSpan.textContent = post.display_date;
        
        summary.appendChild(titleDiv);
        summary.appendChild(dateSpan);
        details.appendChild(summary);
        
        const contentDiv = document.createElement('div');
        contentDiv.className = 'about-text';
        contentDiv.innerHTML = '<p style="color:#888; font-style:italic;">Loading content...</p>';
        details.appendChild(contentDiv);
        
        let contentLoaded = false;
        
        const loadContent = async () => {
          if (contentLoaded) return;
          try {
            const contentResponse = await fetch(`assets/posts/${post.filename}`);
            if (!contentResponse.ok) {
              throw new Error('Failed to fetch post content');
            }
            let rawContent = await contentResponse.text();
            
            // Strip frontmatter if present
            if (rawContent.startsWith('---')) {
              const parts = rawContent.split('---');
              if (parts.length >= 3) {
                rawContent = parts.slice(2).join('---').trim();
              }
            }
            
            // Render markdown or HTML
            if (post.filename.endsWith('.md')) {
              if (typeof marked !== 'undefined') {
                contentDiv.innerHTML = marked.parse(rawContent);
              } else {
                contentDiv.innerHTML = rawContent.split('\n\n').map(p => `<p>${p.replace(/\n/g, '<br>')}</p>`).join('');
              }
            } else {
              contentDiv.innerHTML = rawContent;
            }
            contentLoaded = true;
          } catch (err) {
            contentDiv.innerHTML = `<p style="color:red;">Error loading post: ${err.message}</p>`;
          }
        };

        summary.addEventListener('click', function(e) {
          if (post.private && !authenticatedBlogs.has(post.filename)) {
            if (!details.open) {
              e.preventDefault();
              promptPassword(post, details, loadContent);
              return;
            }
          }
          
          if (!details.open) {
            loadContent();
          }
        });
        
        container.appendChild(details);
      });
    } catch (err) {
      container.innerHTML = `<div style="font-family:Tahoma, sans-serif; font-size:11px; padding:10px; color:red;">Failed to load blogs: ${err.message}</div>`;
    }
  }

  function promptPassword(post, details, onSuccess) {
    const overlay = document.createElement('div');
    overlay.style.cssText = 'position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); display:flex; align-items:center; justify-content:center; z-index:9999;';
    
    const dialog = document.createElement('div');
    dialog.style.cssText = 'background:#ece9d8; border:2px solid; border-color:#dfdedb #808080 #808080 #dfdedb; padding:40px; text-align:center; max-width:300px; box-shadow:1px 1px 0 #fff inset, 1px 1px 0 #000 outset;';
    
    const title = document.createElement('div');
    title.style.cssText = 'font-family:Tahoma, sans-serif; font-size:13px; font-weight:bold; margin-bottom:20px; color:#333;';
    title.textContent = 'This is a personal post. Enter password:';
    
    const input = document.createElement('input');
    input.type = 'password';
    input.placeholder = 'enter password';
    input.style.cssText = 'width:100%; padding:6px; border:1px inset #a8a498; font-family:Tahoma, sans-serif; font-size:11px; margin-bottom:12px; box-sizing:border-box;';
    
    const button = document.createElement('button');
    button.textContent = 'Enter';
    button.style.cssText = 'background:linear-gradient(180deg, #f0ece0 0%, #d8d0b8 100%); border:1px solid #888; border-radius:3px; padding:5px 20px; font-family:Tahoma, sans-serif; font-size:11px; cursor:pointer; color:#000; box-shadow:1px 1px 0 #fff inset; width:100%;';
    
    function handleSubmit() {
      if (input.value === correctPassword) {
        authenticatedBlogs.add(post.filename);
        details.open = true;
        document.body.removeChild(overlay);
        onSuccess();
      } else {
        alert('Incorrect password');
        input.value = '';
        input.focus();
      }
    }
    
    button.addEventListener('click', handleSubmit);
    input.addEventListener('keypress', function(e) {
      if (e.key === 'Enter') handleSubmit();
    });
    
    overlay.addEventListener('click', function(e) {
      if (e.target === overlay) {
        document.body.removeChild(overlay);
      }
    });
    
    dialog.appendChild(title);
    dialog.appendChild(input);
    dialog.appendChild(button);
    overlay.appendChild(dialog);
    document.body.appendChild(overlay);
    input.focus();
  }

  // Mobile sidebar toggle code
  document.addEventListener('DOMContentLoaded', function() {
    const hamburgerBtn = document.getElementById('hamburger-btn');
    const sidebar = document.getElementById('sidebar');
    
    hamburgerBtn.addEventListener('click', function() {
      hamburgerBtn.classList.toggle('active');
      sidebar.classList.toggle('active');
    });

    const sidebarLinks = sidebar.querySelectorAll('a');
    sidebarLinks.forEach(link => {
      link.addEventListener('click', function() {
        hamburgerBtn.classList.remove('active');
        sidebar.classList.remove('active');
      });
    });

    // Run dynamic blog loader
    loadBlogPosts();
  });
</script>

</body>
